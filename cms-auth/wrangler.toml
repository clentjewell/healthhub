# Cloudflare Worker: Health Hub CMS email + password login.
# Deploy from this directory:  npx wrangler deploy
#
# This is a SEPARATE worker from the site itself. It only handles /admin sign-in.
name = "healthhub-cms-auth"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Login throttle store. A KV counter per IP (10 attempts / 15 min). Sequential
# guessing is blocked reliably; the small race under heavy parallel load is
# covered by requiring a strong editor password (brute force is infeasible).
[[kv_namespaces]]
binding = "RL"
id = "921cd297caed46ad869b1a5592e718a3"

# Secrets are NOT set here (never commit them). Set them with:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put AUTH_USERS
#   npx wrangler secret put ALLOWED_ORIGINS
# See README.md for what each one contains.
