# Build the Astro site and publish it to cPanel over FTPS.
#
# WHY THIS EXISTS
# On Cloudflare the site rebuilds itself whenever content lands on `main`
# (including every CMS "Save"). cPanel/Apache can't build an Astro project, so
# this workflow reproduces that flow: on every push to `main` it builds the site
# and uploads the finished `dist/` to the cPanel document root. Net result is
# unchanged for editors — Save in the CMS → commit to `main` → site live in a
# couple of minutes.
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   CPANEL_FTP_SERVER    the FTP host, e.g. ftp.healthhubtweedcoast.com.au
#   CPANEL_FTP_USERNAME  the cPanel/FTP account username
#   CPANEL_FTP_PASSWORD  its password  (use an FTP account scoped to the docroot)
#   CPANEL_FTP_DIR       the target directory, e.g. /public_html/  (or a subdir)
#
# Until those secrets exist the workflow runs, prints a notice, and succeeds
# WITHOUT doing anything — so it never spams failures while the site is still on
# Cloudflare. Add the secrets when you're ready to cut over to cPanel.
#
# NOTES
# - Uses FTPS (encrypted). If the host only offers plain FTP, change `protocol`
#   to `ftp` — but prefer FTPS, and SFTP if cPanel exposes SSH.
# - The deploy is a mirror: files removed from the build are removed on the
#   server. Point CPANEL_FTP_DIR at a directory used ONLY by this site, or it
#   may delete unrelated files. It keeps a small `.ftp-deploy-sync-state.json`
#   in that directory to make later deploys fast (delta-only).
# - `.htaccess` (redirects + security headers) is a dotfile inside dist/ and is
#   uploaded like any other file.

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check cPanel is configured
        id: cfg
        run: |
          if [ -n "${{ secrets.CPANEL_FTP_SERVER }}" ] && [ -n "${{ secrets.CPANEL_FTP_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cPanel FTP secrets not set — skipping deploy. Add CPANEL_FTP_* secrets to enable."
          fi

      - name: Check out the repository
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.cfg.outputs.enabled == 'true'
        run: npm ci

      - name: Build the site
        if: steps.cfg.outputs.enabled == 'true'
        run: npm run build

      - name: Publish dist/ to cPanel over FTPS
        if: steps.cfg.outputs.enabled == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.CPANEL_FTP_DIR }}
