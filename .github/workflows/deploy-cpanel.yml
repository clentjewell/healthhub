# Build the Astro site and publish it to cPanel over FTPS.
#
# WHY THIS EXISTS
# On Cloudflare the site rebuilds itself whenever content lands on `main`
# (including every CMS "Save"). cPanel/Apache can't build an Astro project, so
# this workflow reproduces that flow: build the site and upload the finished
# `dist/` to the cPanel document root.
#
# ONE-TIME SETUP
# 1. Repo → Settings → Secrets and variables → Actions → Secrets:
#      CPANEL_FTP_SERVER    FTP host, e.g. ftp.healthhubtweedcoast.com.au
#      CPANEL_FTP_USERNAME  cPanel/FTP account username
#      CPANEL_FTP_PASSWORD  its password (use an FTP account scoped to the docroot)
#      CPANEL_FTP_DIR       target directory, e.g. /public_html/  (or a subdir)
# 2. To VALIDATE the secrets safely: Actions → "Deploy to cPanel" → Run workflow,
#    leave "dry_run" ticked. It connects, logs in and checks the directory but
#    uploads/deletes nothing.
# 3. Automatic deploys: ON by default. Once the FTP secrets exist, every push
#    to main builds and uploads (this is the CMS Save → deploy loop). To PAUSE
#    it, add repo variable (Settings → Secrets and variables → Actions →
#    Variables) CPANEL_DEPLOY_ENABLED = false. Delete it (or set anything else)
#    to resume. A manual "Run workflow" always deploys, pause or not.
#
# SAFETY
# - Deploys need the FTP secrets; without them every run is a no-op.
# - To pause auto-deploy set repo variable CPANEL_DEPLOY_ENABLED=false.
# - The deploy MIRRORS dist/: files removed from the build are removed on the
#   server. Point CPANEL_FTP_DIR at a directory used ONLY by this site.
# - FTPS (encrypted). If the host only offers plain FTP switch `protocol: ftp`;
#   prefer SFTP if cPanel exposes SSH.

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the FTP connection only (no files uploaded or deleted)"
        type: boolean
        default: true

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run
        id: cfg
        run: |
          secrets_ok=false
          if [ -n "${{ secrets.CPANEL_FTP_SERVER }}" ] && [ -n "${{ secrets.CPANEL_FTP_PASSWORD }}" ]; then
            secrets_ok=true
          fi
          # The site is live on cPanel, so every push to main should publish
          # (that's the CMS Save -> deploy loop). Deploy by default whenever the
          # FTP secrets are present; the only way to PAUSE auto-deploy is to set
          # the repo variable CPANEL_DEPLOY_ENABLED to the exact string "false".
          # (A manual "Run workflow" always deploys, ignoring the pause.)
          run=false
          if [ "$secrets_ok" = true ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              run=true
            elif [ "${{ vars.CPANEL_DEPLOY_ENABLED }}" != "false" ]; then
              run=true
            fi
          fi
          dry=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then
            echo "::notice::Skipping cPanel deploy. secrets set: $secrets_ok. Auto-deploy is paused (repo variable CPANEL_DEPLOY_ENABLED=false), or the FTP secrets are missing. Set CPANEL_DEPLOY_ENABLED to anything other than false (or delete it) to resume; or run this workflow manually."
          else
            echo "::notice::Running cPanel deploy (dry-run: $dry)."
          fi

      - name: Check out the repository
        if: steps.cfg.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.cfg.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.cfg.outputs.run == 'true'
        run: npm ci

      - name: Build the site
        if: steps.cfg.outputs.run == 'true'
        run: npm run build

      - name: Publish dist/ to cPanel over FTPS
        if: steps.cfg.outputs.run == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.CPANEL_FTP_DIR }}
          dry-run: ${{ steps.cfg.outputs.dry == 'true' }}
          # SAFETY: never wipe the target first. This cPanel public_html also
          # contains the Pottsville site folder and WordPress leftovers; the
          # deploy must only manage its own files (it tracks them in
          # .ftp-deploy-sync-state.json and never deletes anything else). Do NOT
          # set this to true.
          dangerous-clean-slate: false
