eyebrow: Meet the team
heading: Our Practitioners
lede: A multidisciplinary team of practitioners and teachers under one roof — each leading their own service, from acupuncture and naturopathy to yoga, pilates, movement and sound.
metaTitle: Our Practitioners · Health Hub Tweed Coast
metaDescription: Meet the eight practitioners at Health Hub Tweed Coast, Hastings Point — acupuncture, naturopathy, yoga, pilates, movement and sound therapy.
whoWeAre:
  eyebrow: Who we are
  heading: Here to help you heal and live your fullest life
  paragraphs:
    - We are a group of therapists, practitioners and teachers who have come together with the sole purpose of helping you heal and live your fullest life.
    - Realise your dreams of health, wellbeing, freedom and abundance. Whether it's overcoming a debilitating health condition, finding the inspiration to kick a habit, shifting destructive patterns, or simply relaxing and unwinding — the Health Hub is here for you.
  image: /images/our-practitioners.webp
  imageAlt: A family smiling together
  pointsIntro: The Health Hub is where…
  points:
    - You are supported, respected and cared for on your healing journey.
    - Your body, mind and heart are empowered to heal.
    - Your pain is relieved, your energy restored and your passion for living revitalised.
    - Your personal and lifestyle goals are met.
    - You have access to a variety of allied, holistic and complementary therapies.
    - Practitioners and therapists work together with you.
    - Your family's health concerns are the collaborative focus of everyone involved.
    - You have a choice of one-on-one consultations, classes, workshops and group therapy.
