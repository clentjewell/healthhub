welcome:
  eyebrow: Welcome
  heading: Welcome to Health Hub Tweed Coast
  paragraphs:
    - >-
      We are a group of therapists, practitioners and teachers who have come
      together with the sole purpose to help you and your family heal and live
      full lives.
    - >-
      Receive the care you deserve, delivered collaboratively from a group of
      dedicated and talented practitioners and therapists.

