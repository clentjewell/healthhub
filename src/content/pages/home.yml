    Health Hub Tweed Coast — a community wellness studio where independent
    practitioners work alongside each other. Acupuncture and allied health,
    movement classes and events, all under one roof on the Tweed Coast.
  primaryLabel: Make a Booking
  primaryHref: /make-a-booking
  secondaryLabel: See the timetable
