# Homepage content — editable in the CMS under "Pages → Home".
metaTitle: Health Hub Tweed Coast · Wellness Studio, Hastings Point
metaDescription: >-
  Acupuncture, naturopathy, yoga, pilates, movement and sound therapy under one roof at Hastings Point on the NSW Tweed Coast.

hero:
  eyebrow: Wellness studio · Hastings Point
  heading: Body, Mind & Soul
  lede: >-
    Health Hub Tweed Coast — the community wellness studio arm of Pottsville
    Acupuncture. Acupuncture and allied health, movement classes and events, all
    under one roof on the Tweed Coast.
  primaryLabel: Make a Booking
  primaryHref: /make-a-booking
  secondaryLabel: See the timetable
  secondaryHref: /events

welcome:
  eyebrow: Welcome
  heading: Welcome to Health Hub Tweed Coast
  paragraphs:
    - >-
      We are a group of therapists, practitioners and teachers who have come
      together with the sole purpose to help you and your family heal and live
      full lives.
    - >-
      Receive the care you deserve, delivered collaboratively from a group of
      dedicated and talented practitioners and therapists.

# Services and Practitioners both link to the same eight profiles. Turn any of
# these off here — the rest of the page, and the site's structured data, are
# unaffected.
#
# Services is currently showing TWICE on purpose, as two designs of the same
# section for the client to choose between: the grid (A) and the full-bleed
# carousel (B). Once they pick, set the other to false. Leaving both on
# permanently would list all eight services twice on one page.
showServices: true          # design A — grid
showServicesCarousel: true  # design B — carousel, same layout as Practitioners

# Hidden, not deleted. The section, its content below and its eight cards are
# all still here — flip this back to true to bring it straight back.
showPractitioners: false

services:
  eyebrow: What we offer
  heading: Our Services
  lede: >-
    Each service is led by the practitioner who provides it — choose a service to
    meet them, see their fees and book directly.

