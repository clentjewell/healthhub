items:
  - id: booking
    q: How do I book an appointment or class?
    a: Booking is direct with the practitioner running that service. {{bookOnline}} can be booked online. {{bookByPhone}} are booked by phone or text with the relevant practitioner. Kirtan & Harmonium Chant is available by arrangement. Every practitioner's own number and booking link is on their profile, and if you're unsure who to contact, call the Hub on {{phone}}.
  - id: hub-vs-pottsville
    q: Is Health Hub Tweed Coast the same as Pottsville Acupuncture?
    a: No — they're two separate businesses, with Dr Mal McKay involved in both. Health Hub Tweed Coast is a studio at {{address}} from which independent practitioners and businesses work alongside one another, across yoga, Pilates, naturopathy, movement and sound healing as well as acupuncture. Each runs their own practice and handles their own bookings and fees. Pottsville Acupuncture is Dr Mal's own acupuncture and Chinese medicine practice, from the clinic next to the Hub. So you'll find him in both places — but an acupuncture appointment is booked with Pottsville Acupuncture, and a class is booked with the practitioner running it.
  - id: holistic-health
    q: What is holistic health care, and why choose a multi-disciplinary centre over a single specialist?
    a: Holistic health care treats the whole person — body, mind and energy — rather than one symptom in isolation. At Health Hub that looks like acupuncture, naturopathy, yoga, Pilates, movement and sound healing all working from the same address, so it's easier to build a plan that joins the dots between pain, energy, stress and mobility, rather than tackling each in isolation with a different provider each time.
  - id: naturopath-or-gp
    q: Naturopath or GP — which should I see for family health concerns?
    a: 'They''re not a substitute for each other. Our naturopath, Amanda Ross, uses natural health strategies and traditional naturopathic knowledge to support your family''s everyday health and wellbeing, working alongside — not instead of — your GP''s medical care. Many families use both: a GP for diagnosis and medical treatment, and naturopathy for broader lifestyle and wellbeing support.'
  - id: yoga-or-pilates
    q: Yoga or Pilates — which is better for beginners?
    a: Yoga (with Alicia Grace, or Hatha & Yin Yoga with Kate Doedee) centres on breath, alignment and meditation. Pilates & Body Balance with Monique Carole centres on controlled strength and body awareness. Neither requires experience — both are taught in a guided, invitational way — so it comes down to whether you're after calm and flexibility or strength and control.
  - id: trauma-informed-yoga
    q: Do you offer trauma-informed or gentle yoga classes, and how are they different?
    a: Yes. Alicia Grace's Yoga & Meditation classes are taught with a trauma-informed lens — every session is invitational and choice-based, so you're guided through options rather than a fixed sequence. It's a supportive option if you'd simply prefer a gentler, more adaptable class where you set the pace.
  - id: seniors-yoga
    q: Is there yoga suitable for seniors or people wanting a gentler class?
    a: Yes — gentler, lower-impact options are available as part of our yoga and movement timetable, distinct from our faster-paced or more physically demanding classes. Contact Alicia Grace or Kate Doedee to find the right level for your goals.
  - id: embodied-movement
    q: What is embodied movement, and how is it different from a regular dance or fitness class?
    a: Embodied movement with Rebecca Lindsay is less about following steps and more about learning to feel the body rather than just think about it — using guided movement, breath and presence to explore instinctive awareness beneath everyday thought. It suits people wanting a more intuitive, body-led way to move, rather than a set workout routine.
  - id: acupuncture
    q: What is acupuncture, and how might it help with pain?
    a: Dr Mal McKay is a registered acupuncturist (Chinese Medicine Board of Australia) with over 30 years of clinical experience in acupuncture and Traditional Chinese Medicine. Acupuncture is a long-established, drug-free approach within Traditional Chinese Medicine that many people use to support pain management and general wellbeing. Results vary from person to person, so Dr Mal can talk through what's suitable for your specific situation at your first consultation.
  - id: sound-healing
    q: What is sound healing with crystal bowls, and what can I expect?
    a: Crystal Sound Bowls with Pearl Blinco-Doffiny use crystal bowl vibrations to support relaxation and a sense of grounding, in a safe, nurturing space. No experience is needed — you're simply invited to relax and receive.
  - id: referral
    q: Do I need a referral from my GP to book?
    a: No — you can book directly with any of our practitioners without a referral. If you're managing a specific medical condition, it's still worth keeping your GP in the loop, but it isn't required to get started here.
  - id: first-visit
    q: What should I expect at my first visit?
    a: For a private consultation (acupuncture, naturopathy), your practitioner will talk through your health history and goals before recommending next steps. For a class, arrive a little early in comfortable clothing and mention it's your first time — the instructor will guide you from there.
  - id: location-hours
    q: Where are you located, and what are your hours?
    a: '{{address}} — the studio is open {{hours}}. Some classes and consultations run later than that, so check the weekly timetable or with the relevant practitioner for exact times.'
