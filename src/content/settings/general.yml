# =============================================================================
# Site-wide settings — editable in the CMS under "Settings → General".
#
# This is the single source of truth for the address, hours, phone, socials,
# the header menu and the footer text. The LocalBusiness schema (SEO) reads
# from here too, so the address only ever needs changing in one place.
# =============================================================================

brandName: Health Hub
brandTagline: Tweed Coast

# ---- Address & contact (NAP) ------------------------------------------------
street: 87–89 Tweed Coast Road
locality: Hastings Point
region: NSW
postcode: '2489'
phone: 0415 919 521
# Shared with the Pottsville clinic — confirmed by the client as the address to
# use for the Hub too, rather than a separate healthhubtweedcoast.com.au inbox.
# Setting it here lights it up in all four places at once: the footer, the
# contact page, llms.txt and the LocalBusiness schema.
email: health@pottsvilleacupuncture.com.au
# Points at the studio's own Google Maps listing (by its CID) rather than a
# text search, so "Get directions" lands on the business, not a results list.
mapUrl: https://maps.google.com/?cid=16890111486367809711
mapQuery: 87-89 Tweed Coast Road, Hastings Point NSW 2489
# Exact coordinates from the Google Maps listing — used for the LocalBusiness
# geo and to pin the embedded map on the building.
lat: -28.3688969
lng: 153.5728374

# ---- Opening hours ----------------------------------------------------------
# Studio reception hours, confirmed by the client. Note these feed the
# openingHoursSpecification in the LocalBusiness schema — i.e. the hours Google
# shows — and the timetable currently runs outside them at both ends: a 6:00am
# Wednesday class, and consultations to 7:30pm. Raised with the client.
hoursLabel: Monday – Sunday, 7:00am – 6:30pm
hoursOpen: '07:00'
hoursClose: '18:30'

# ---- Social ----------------------------------------------------------------
socialHandle: '@healthhubtweedcoast'
instagram: https://www.instagram.com/healthhubtweedcoast/
facebook: https://www.facebook.com/HealthHubTweedCoast/

# ---- Header ----------------------------------------------------------------
navItems:
  - label: Home
    href: /
  - label: Practitioners
    href: /our-practitioners
  - label: Events
    href: /events
  - label: Blog
    href: /blog
  - label: FAQ
    href: /faq
  - label: Contact
    href: /contact
bookingLabel: Make a Booking
bookingHref: /make-a-booking

# ---- Footer ----------------------------------------------------------------
footerBlurb: >-
  A community wellness studio at Hastings Point, where independent practitioners
  work alongside each other — movement, allied health and events on the Tweed
  Coast.
footerNote: Made on the Tweed Coast.

# ---- Integrations ----------------------------------------------------------
# Where the contact form posts. Leave blank until the endpoint is confirmed.
contactFormEndpoint: ''
