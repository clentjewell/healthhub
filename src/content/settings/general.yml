# =============================================================================
# Site-wide settings — editable in the CMS under "Settings → General".
#
# This is the single source of truth for the address, hours, phone, socials,
# the header menu and the footer text. The LocalBusiness schema (SEO) reads
# from here too, so the address only ever needs changing in one place.
# =============================================================================

brandName: Health Hub
brandTagline: Tweed Coast

# ---- Address & contact (NAP) ------------------------------------------------
street: 87–89 Tweed Coast Road
locality: Hastings Point
region: NSW
postcode: '2489'
phone: 0415 919 521
# Shared with the Pottsville clinic — confirmed by the client as the address to
# use for the Hub too, rather than a separate healthhubtweedcoast.com.au inbox.
# Setting it here lights it up in all four places at once: the footer, the
# contact page, llms.txt and the LocalBusiness schema.
email: health@pottsvilleacupuncture.com.au
# Points at the studio's own Google Maps listing (by its CID) rather than a
# text search, so "Get directions" lands on the business, not a results list.
mapUrl: https://maps.google.com/?cid=16890111486367809711
mapQuery: 87-89 Tweed Coast Road, Hastings Point NSW 2489
# Paste the "Embed a map" code from the Google Business listing here to show the
# rich map card (name, star rating, directions). Google Maps → find the studio →
# Share → "Embed a map" → copy → paste the whole <iframe…> or just its src.
# Leave blank to use the simple place map.
mapEmbed: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3510.667619537652!2d153.57026247532553!3d-28.36889687580969!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6b90f796264e0e39%3A0xea65bae8c1b2c0af!2sHealth%20Hub%20Tweed%20Coast!5e0!3m2!1sen!2s!4v1788953404252!5m2!1sen!2s"
# Exact coordinates from the Google Maps listing — used for the LocalBusiness
# geo and to pin the embedded map on the building.
lat: -28.3688969
lng: 153.5728374

# ---- Opening hours ----------------------------------------------------------
# Studio hours, set by the client (24 Aug 2026: "tie it down, 7am to 7:30pm,
# Monday to Sunday") to cover the timetable end to end. These feed the
# openingHoursSpecification in the LocalBusiness schema — i.e. the hours Google
# shows. One session still runs past close: Embodied Movement & Dance,
# 7:00–8:15pm on the first Friday of each month.
hoursLabel: Monday – Sunday, 7:00am – 7:30pm
hoursOpen: '07:00'
hoursClose: '19:30'

# ---- Social ----------------------------------------------------------------
socialHandle: '@healthhubtweedcoast'
instagram: https://www.instagram.com/healthhubtweedcoast/
facebook: https://www.facebook.com/HealthHubTweedCoast/

# ---- Header ----------------------------------------------------------------
navItems:
  - label: Home
    href: /
  - label: Practitioners
    href: /our-practitioners
  - label: Events
    href: /events
  - label: Blog
    href: /blog
  - label: FAQ
    href: /faq
  - label: Contact
    href: /contact
bookingLabel: Make a Booking
bookingHref: /make-a-booking

# ---- Footer ----------------------------------------------------------------
footerBlurb: >-
  A community wellness studio at Hastings Point, where independent practitioners
  work alongside each other — movement, allied health and events on the Tweed
  Coast.
footerNote: ""

# ---- Integrations ----------------------------------------------------------
# Where the contact form posts. FormSubmit delivers submissions to the inbox
# named in the URL — no account needed, but the FIRST submission emails that
# inbox an activation link which must be clicked before anything is delivered.
# rao@ is the test inbox (client, 24 Aug 2026); once testing is done, swap to
# https://formsubmit.co/health@pottsvilleacupuncture.com.au and have the client
# click the new activation email.
contactFormEndpoint: '/contact.php'
