# =============================================================================
# Health Hub Tweed Coast — content editor configuration
#
# Powers the /admin editor (Sveltia CMS; this file is also Decap-compatible).
# Editors change content here → the CMS commits to GitHub → GitHub Actions
# rebuilds and redeploys the site automatically.
#
# ⚠️  The field definitions below intentionally mirror src/content.config.ts.
#     If a field is added/renamed there, mirror it here (and vice versa) or the
#     CMS will write content the build rejects.
# =============================================================================

backend:
  name: github
  repo: clentjewell/healthhub
  branch: main
  # Deployed sveltia-cms-auth worker. Its GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
  # variables must be set in the Cloudflare dashboard before sign-in works —
  # see docs/EDITING-THE-WEBSITE.md steps 2b–2c.
  base_url: https://sveltia-cms-auth.clent.workers.dev
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload image "{{path}}"'
    deleteMedia: 'content: delete image "{{path}}"'

media_folder: public/images/uploads
public_folder: /images/uploads

site_url: https://healthhubtweedcoast.com.au

collections:
  # ===========================================================================
  # PAGES — text on the fixed pages. Layout stays in the templates.
  # ===========================================================================
  - name: pages
    label: Pages
    description: Wording on each page. Add/remove pages is a developer task.
    editor: { preview: false }
    files:
      - name: home
        label: Home
        file: src/content/pages/home.yml
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text, hint: 'Around 150 characters — shows in Google results.' }
          - label: Hero (top of page)
            name: hero
            widget: object
            fields:
              - { label: Small label above heading, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro paragraph, name: lede, widget: text, required: false }
              - { label: Main button text, name: primaryLabel, widget: string, required: false }
              - { label: Main button link, name: primaryHref, widget: string, required: false, default: /make-a-booking }
              - { label: Second button text, name: secondaryLabel, widget: string, required: false }
              - { label: Second button link, name: secondaryHref, widget: string, required: false, default: /events }
          - label: Welcome section
            name: welcome
            widget: object
            fields:
              - { label: Small label, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - label: Paragraphs
                name: paragraphs
                widget: list
                field: { label: Paragraph, name: paragraph, widget: text }
          - label: Show the Services section
            name: showServices
            widget: boolean
            default: true
            hint: >-
              Turn the Services grid off to hide it. The team is reached through
              the Practitioners page in the menu.
          - label: Services section
            name: services
            widget: object
            hint: >-
              Wording only. The tiles themselves come from each practitioner's
              service, so there is nothing to add here when the team changes.
            fields:
              - { label: Small label, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lede, widget: text, required: false }
          - label: Events section
            name: events
            widget: object
            fields:
              - { label: Small label, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: lede, widget: text, required: false }
              - { label: Button text, name: linkLabel, widget: string, required: false }
          - label: Find us section
            name: location
            widget: object
            fields:
              - { label: Small label, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Directions button text, name: directionsLabel, widget: string, required: false }
              - { label: Contact button text, name: contactLabel, widget: string, required: false }
          - label: "\"Two ways in\" band (shown on most pages)"
            name: cta
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Left heading, name: leftHeading, widget: string }
              - { label: Left text, name: leftBody, widget: text, required: false }
              - { label: Left button text, name: leftLabel, widget: string }
              - { label: Left button link, name: leftHref, widget: string }
              - { label: Right heading, name: rightHeading, widget: string }
              - { label: Right text, name: rightBody, widget: text, required: false }
              - { label: Right button text, name: rightLabel, widget: string }
              - { label: Right button link, name: rightHref, widget: string }

      - name: practitioners_page
        label: Practitioners (page wording)
        file: src/content/pages/practitioners.yml
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text }
          - { label: Small label, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro paragraph, name: lede, widget: text, required: false }

      - name: events_page
        label: Classes & Events (page wording)
        file: src/content/pages/events.yml
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text }
          - { label: Small label, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro paragraph, name: lede, widget: text, required: false }
          - { label: Text when nothing is listed, name: emptyEventsText, widget: string, required: false }

      - name: booking
        label: Make a Booking
        file: src/content/pages/booking.yml
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text }
          - { label: Small label, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro paragraph, name: lede, widget: text, required: false }
          - label: Extra note below the list
            name: extraNote
            widget: text
            required: false
            hint: Leave blank to hide. Good for practitioners who aren't listed above.

      - name: faq
        label: FAQ
        file: src/content/pages/faq.yml
        description: >-
          Heading and search-engine wording for the FAQ page. The questions
          themselves are edited under "FAQ" in the sidebar.
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text, hint: 'Around 150 characters — shows in Google results.' }
          - { label: Small label above heading, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro paragraph, name: lede, widget: text, required: false }

      - name: blog
        label: Blog (index page wording)
        file: src/content/pages/blog.yml
        description: >-
          Heading and search-engine wording for the blog index. The posts
          themselves are written under "Blog" in the sidebar.
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text }
          - { label: Small label above heading, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro paragraph, name: lede, widget: text, required: false }

      - name: contact
        label: Contact
        file: src/content/pages/contact.yml
        fields:
          - { label: Browser tab title, name: metaTitle, widget: string }
          - { label: Search-engine description, name: metaDescription, widget: text }
          - { label: Small label, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro paragraph, name: lede, widget: text, required: false }
          - { label: Form heading, name: formHeading, widget: string, required: false }
          - { label: Send button text, name: submitLabel, widget: string, required: false }
          - { label: Show the map, name: showMap, widget: boolean, default: true }

  # ===========================================================================
  # PRACTITIONERS — add, edit and remove team members
  # ===========================================================================
  - name: practitioners
    label: Practitioners
    label_singular: Practitioner
    description: >-
      Team members. Each has their own page. "Order" controls where they appear
      in the list (1 shows first).
    folder: src/content/practitioners
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{name}}'
    summary: '{{order}}. {{name}} — {{role}}'
    sortable_fields: [order, name, role]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role / title, name: role, widget: string, hint: 'e.g. Naturopath, Yin & Hatha Yoga Teacher' }
      - { label: Order, name: order, widget: number, value_type: int, min: 1, default: 99, hint: Lower numbers appear first. }
      - { label: Photo, name: image, widget: image, required: false, hint: 'Portrait orientation works best (roughly 4:5).' }
      - { label: Service they lead, name: service, widget: string, required: false, hint: 'Optional tag shown on their card, e.g. naturopathy, yoga-meditation.' }
      - { label: Phone, name: phone, widget: string, required: false }
      - { label: Booking link, name: bookingUrl, widget: string, required: false, hint: 'Full https:// link. Leave blank if they take bookings by phone.' }
      - { label: Facebook, name: facebook, widget: string, required: false }
      - { label: Instagram, name: instagram, widget: string, required: false }
      - { label: Website, name: website, widget: string, required: false }
      - label: Sessions & Fees
        name: feeGroups
        widget: list
        required: false
        label_singular: Fee group
        summary: '{{fields.title}}'
        hint: >-
          Each group is a box on their page. Use a group with several options for
          a class with passes; use title + price for a single service.
        fields:
          - { label: Group title, name: title, widget: string }
          - { label: Duration, name: duration, widget: string, required: false, hint: 'e.g. 75 minutes' }
          - { label: Single price, name: price, widget: string, required: false, hint: 'Use for a one-off service, e.g. $146' }
          - { label: Description, name: note, widget: text, required: false }
          - label: Options
            name: items
            widget: list
            required: false
            label_singular: Option
            summary: '{{fields.label}} — {{fields.price}}'
            fields:
              - { label: Option, name: label, widget: string, hint: 'e.g. Casual class, 5 Class Pass' }
              - { label: Price, name: price, widget: string, required: false }
      - label: Profile / bio
        name: body
        widget: markdown
        required: false
        hint: Their full bio. Use headings to break up long content.
      - { label: Modalities (internal), name: modalities, widget: hidden, default: [] }
      - { label: Placeholder flag (internal), name: placeholder, widget: hidden, default: false }

  # ===========================================================================
  # CLASSES & EVENTS — the studio's offerings, each with its own page
  # ===========================================================================
  - name: events
    label: Classes & Events
    label_singular: Class or event
    description: >-
      Everything running at the studio. Each entry gets its own page. These stay
      on the site until you hide or delete them — they don't expire.
    folder: src/content/events
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{title}}'
    summary: '{{order}}. {{title}}'
    sortable_fields: [order, title, category]
    fields:
      - { label: Name, name: title, widget: string, hint: 'e.g. Hatha & Yin Yoga' }
      - { label: Order, name: order, widget: number, value_type: int, min: 1, default: 99, hint: Lower numbers appear first. The first four also show on the homepage. }
      - label: Category
        name: category
        widget: select
        default: other
        options:
          - { label: Class / course, value: course }
          - { label: Workshop, value: workshop }
          - { label: Seminar, value: seminar }
          - { label: Sound Bath, value: sound-bath }
          - { label: Community, value: community }
          - { label: Other, value: other }
      - label: When
        name: schedule
        widget: string
        required: false
        hint: 'Written however you like, e.g. "Tuesdays & Thursdays 9:30am – 10:30am"'
      - label: Short summary
        name: summary
        widget: text
        hint: One or two sentences — this is what shows on the card.
      - label: Image
        name: image
        widget: image
        required: false
        hint: The class flyer or a photo. Shown whole, so text on the image stays readable.
      - { label: Led by, name: instructor, widget: string, required: false }
      - { label: Their phone, name: instructorPhone, widget: string, required: false, hint: 'Number only — put an email in the field below, not here.' }
      - { label: Their email, name: instructorEmail, widget: string, required: false }
      - { label: Their website, name: instructorWebsite, widget: string, required: false, hint: 'Full address with no spaces, e.g. https://example.com/' }
      - { label: Cost, name: price, widget: string, required: false, hint: 'e.g. $24 or $18 per class' }
      - { label: Location, name: location, widget: string, required: false, default: 'Health Hub Tweed Coast, Hastings Point' }
      - label: Booking link
        name: bookingUrl
        widget: string
        required: false
        hint: Full https:// link. Leave blank and visitors get an "Enquire" button instead.
      - label: Class times
        name: sessions
        widget: list
        required: false
        label_singular: session
        summary: '{{fields.day}} {{fields.start}}–{{fields.end}}'
        hint: >-
          Add one row per weekly slot. These drive the "Add to calendar" button —
          leave empty for by-appointment offerings and no button is shown.
        fields:
          - label: Day
            name: day
            widget: select
            options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          - { label: Starts, name: start, widget: string, hint: '24-hour, e.g. 18:00' }
          - { label: Ends, name: end, widget: string, hint: '24-hour, e.g. 19:15' }
          - { label: Class name for this slot, name: label, widget: string, required: false, hint: 'Only if this listing covers several different classes, e.g. Yin Yang Yoga.' }
      - label: Show the weekly timetable table on this page
        name: showTimetable
        widget: boolean
        default: false
        hint: Used by the Studio Time Table page. The table itself is edited under Timetable.
      - label: Show on the site
        name: active
        widget: boolean
        default: true
        hint: Turn off to hide without deleting (e.g. paused over the holidays).
      - { label: Feature this one, name: featured, widget: boolean, default: false }
      - { label: Full details, name: body, widget: markdown, required: false }
      - { label: Next session date (optional), name: date, widget: datetime, required: false, date_format: 'DD MMM YYYY', time_format: 'HH:mm', format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: Placeholder flag (internal), name: placeholder, widget: hidden, default: false }

  # ===========================================================================
  # SETTINGS — header, footer, address, hours, socials
  # ===========================================================================
  - name: timetable
    label: Timetable
    editor: { preview: false }
    files:
      - name: weekly
        label: Weekly studio timetable
        file: src/content/timetable/weekly.yml
        description: >-
          The table shown on the Studio Time Table page. List each day's
          sessions in the order they run.
        fields:
          - label: Note under the table
            name: note
            widget: text
            required: false
          - label: Days
            name: days
            widget: list
            label_singular: day
            summary: '{{fields.day}}'
            fields:
              - { label: Day, name: day, widget: string }
              - label: Sessions
                name: sessions
                widget: list
                required: false
                label_singular: session
                summary: '{{fields.name}} — {{fields.time}}'
                fields:
                  - { label: Class name, name: name, widget: string }
                  - { label: Time, name: time, widget: string, hint: 'Shown as written, e.g. 9:30–10:30am' }
                  - label: Links to
                    name: href
                    widget: string
                    required: false
                    hint: 'e.g. /event/seniors-yoga/ — leave blank for no link.'

  - name: blog
    label: Blog
    label_singular: post
    folder: src/content/blog
    create: true
    slug: '{{fields.title | slugify}}'
    preview_path: 'blog/{{slug}}'
    sortable_fields: ['publishDate', 'title']
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string }
      - label: Browser tab title
        name: metaTitle
        widget: string
        required: false
        hint: 'Leave blank to use the title plus the brand name.'
      - { label: Search-engine description, name: metaDescription, widget: text, hint: 'Around 150 characters — shows in Google results.' }
      - { label: Excerpt, name: excerpt, widget: text, hint: 'One or two sentences, shown on the blog index. Write it to earn the click, not as the first line of the article.' }
      - { label: Category, name: category, widget: string, required: false, hint: 'e.g. Yoga & Meditation' }
      - { label: Author name, name: author, widget: string }
      - label: Author's profile
        name: authorId
        widget: relation
        collection: practitioners
        search_fields: ['name']
        value_field: '{{slug}}'
        display_fields: ['name']
        required: false
        hint: 'Links the byline to their practitioner page. Leave blank for guest writers.'
      - { label: Publish date, name: publishDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true }
      - { label: Last updated, name: updatedDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, required: false }
      - { label: Header image, name: image, widget: image, required: false }
      - { label: Header image description, name: imageAlt, widget: string, required: false, hint: 'Describes the image for screen readers and search engines.' }
      - { label: Reading time (minutes), name: readingMinutes, widget: number, value_type: int, required: false }
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: 'On = hidden from the live site. Turn off to publish.'
      - { label: Article, name: body, widget: markdown }

  - name: faq
    label: FAQ
    editor: { preview: false }
    files:
      - name: general
        label: Questions & answers
        file: src/content/faq/general.yml
        description: >-
          The questions on /faq/, in the order they appear. Answers may use
          placeholders so shared facts are never typed twice — see the hint on
          the Answer field. A misspelt placeholder stops the site publishing,
          rather than showing a visitor the raw text.
        fields:
          - label: Questions
            name: items
            widget: list
            label_singular: question
            summary: '{{fields.q}}'
            fields:
              - { label: Question, name: q, widget: string }
              - label: Answer
                name: a
                widget: text
                hint: >-
                  Placeholders: {{address}}, {{hours}}, {{phone}},
                  {{bookOnline}} (services bookable online), {{bookByPhone}}
                  (booked by phone or text). These fill in from Settings and the
                  practitioner profiles when the site builds.
              - label: Link anchor
                name: id
                widget: string
                hint: >-
                  Used for linking straight to this answer, e.g. "booking"
                  makes /faq/#booking. Lower-case, no spaces. Changing it
                  breaks any existing link to this answer.
          - label: Disclaimer under the list
            name: disclaimer
            widget: text
            required: false

  - name: settings
    label: Settings
    editor: { preview: false }
    files:
      - name: general
        label: General (header, footer, contact details)
        file: src/content/settings/general.yml
        description: >-
          Used across the whole site — the address and hours here also feed
          Google's business listing data.
        fields:
          - { label: Brand name, name: brandName, widget: string }
          - { label: Brand tagline, name: brandTagline, widget: string }

          - { label: Street address, name: street, widget: string }
          - { label: Suburb, name: locality, widget: string }
          - { label: State, name: region, widget: string }
          - { label: Postcode, name: postcode, widget: string }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Google Maps link (Get directions button), name: mapUrl, widget: string }
          - { label: Address for the embedded map, name: mapQuery, widget: string, hint: 'Plain address, e.g. 87-89 Tweed Coast Road, Hastings Point NSW 2489' }
          - { label: Latitude, name: lat, widget: number, value_type: float, required: false, hint: 'From the studio Google Maps listing. Pins the map and feeds Google.' }
          - { label: Longitude, name: lng, widget: number, value_type: float, required: false }

          - { label: Opening hours (as shown), name: hoursLabel, widget: string, hint: 'e.g. Monday – Sunday, 8:00am – 6:30pm' }
          - { label: Opens at, name: hoursOpen, widget: string, hint: '24-hour HH:MM — used for Google', pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Use 24-hour HH:MM'] }
          - { label: Closes at, name: hoursClose, widget: string, hint: '24-hour HH:MM — used for Google', pattern: ['^([01][0-9]|2[0-3]):[0-5][0-9]$', 'Use 24-hour HH:MM'] }

          - { label: Social handle, name: socialHandle, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
          - { label: Facebook URL, name: facebook, widget: string, required: false }

          - label: Header menu
            name: navItems
            widget: list
            label_singular: Menu item
            summary: '{{fields.label}} → {{fields.href}}'
            hint: >-
              Links must point at pages that exist — /, /our-practitioners,
              /events, /contact, /make-a-booking.
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - { label: Header button text, name: bookingLabel, widget: string }
          - { label: Header button link, name: bookingHref, widget: string }

          - { label: Footer intro text, name: footerBlurb, widget: text }
          - { label: Footer small print, name: footerNote, widget: string, required: false }

          - label: Contact form endpoint
            name: contactFormEndpoint
            widget: string
            required: false
            hint: Where the contact form submits. Leave blank until it's set up.
