<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The editor must never be indexed (also blocked in robots.txt). -->
    <meta name="robots" content="noindex,nofollow" />
    <title>Content Editor · Health Hub Tweed Coast</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Shown only while the editor bundle loads, or if it fails to load. */
      .boot {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        max-width: 34rem;
        margin: 18vh auto 0;
        padding: 0 1.5rem;
        color: #2a3742;
        text-align: center;
      }
      .boot h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      .boot p { color: #5c6b75; line-height: 1.6; margin: 0.4rem 0; font-size: 0.95rem; }
      .boot code { background: #eaf5f6; padding: 0.1em 0.35em; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div class="boot" id="boot">
      <h1>Loading the content editor…</h1>
      <p>
        If this message stays on screen, the editor could not start. Check that
        <code>base_url</code> in <code>/admin/config.yml</code> points at your
        auth worker, then reload.
      </p>
    </div>

    <!--
      Sveltia CMS — a git-based editor that commits straight to GitHub.
      Config lives in ./config.yml (Decap-compatible, so swapping to Decap is a
      one-line change of this script tag).
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.175.1/dist/sveltia-cms.js" type="module"></script>
    <script>
      // The CMS replaces the document body once it mounts; if it never does,
      // the boot message above stays visible as a diagnostic.
      window.addEventListener('load', () => {
        setTimeout(() => {
          const boot = document.getElementById('boot');
          if (boot && document.querySelector('#nc-root, .sveltia-cms, [class*="cms"]')) boot.remove();
        }, 2500);
      });
    </script>
  </body>
</html>
